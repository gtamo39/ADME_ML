SERAC_C:                    # named palette: name -> hex (quote hex; '#' is a YAML comment otherwise)
  azure: '#0EA5CE'
  ember: '#E65D32'
  terracotta: '#EEA090'
  gold: '#E8B04B'
  olive: '#74B24A'
  sky_blue: '#A6C8E4'
  paper: '#E3E0DA'

CHEMLIB_OVERWRITE: false
CHEMLIB_PATH: data/chemical_libs/SERAC_lib.csv
SOL_OVERWRITE: false
CUTOFF_SOL: 10

# --- single-task RF systematic run (python/run_RF_SingleTask_systematic.py) ---
RF_SINGLETASK:
  seed: 42
  n_jobs: 32
  cv_folds: 5
  output_dir: output/predictions_runs
  features_type: H236                 # H236 (MLTrail-deployable) | MFDS (needs descriptastorus + custom featurizer)
  champion: {n_estimators: 200, max_depth: 20, max_features: 0.3, min_samples_leaf: 2}
  register_mltrail: true
  archive_public_in_trainset: true   # archive the FULL internal+public trainset (reproducible in isolation)
  # per-endpoint public sources for the deployed "augmented" model (default = all available parquets).
  # solubility: EXPERIMENTAL only — ADMETlab PREDICTED solubility HURTS (wiki 2026-07: experimental
  # moves temporal 0.044->0.313, predicted pseudo-labels poison newest compounds). Others use all available.
  augmented_sources:
    solubility: [EXP]            # ADMETlab predicted solubility poisons it (wiki 2026-07)
    mdck: [NVS]                  # ADM ablation: dropping ADMETlab lifts mdck 0.163 -> 0.321
    ppb: [EXP, NVS]              # ADM ablation: dropping ADMETlab lifts ppb 0.149 -> 0.316

# --- ADME public-data cleaning sweep (python/adme_cleaning_sweep.py) ---
# The solubility cleaning sweep generalized to the other endpoints: clean ONLY the public augmentation
# (EXP experimental / NVS+ADM predicted), keep the internal test FIXED, evaluate the champion RF in the
# temporal + 5-fold-CV arms, and rank by the calibration-sensitive R²_det (NOT affine-invariant Pearson).
# The dominant lever mirrors solubility's thermo-vs-kinetic: EXPERIMENTAL-vs-PREDICTED source matching.
ADME_CLEAN_SWEEP:
  endpoints: [logd, hlm, mlm, rlm, mdck, ppb, caco2]   # solubility handled by the SOL_* switch
  predicted_cap: 40000        # subsample per PREDICTED source (NVS/ADM) for sweep tractability (seed=RF seed); EXP kept fully
  winsor_pct: [0.01, 0.99]    # winsorize label to these quantiles (per source)
  iqr_k: 3.0                  # per-origin Tukey fence multiplier for the IQR cleaner
  phys_range:                 # absolute plausibility bounds in MODELLING space; public outside = unit error / impossible
    logd:  [-6, 12]           # LogD7.4 (identity transform)
    hlm:   [-2, 6]            # log10 µL/min/mg CLint  (0.01 .. 1e6)
    mlm:   [-2, 6]
    rlm:   [-2, 6]
    mdck:  [-3, 3]            # log10 1e-6 cm/s Papp    (0.001 .. 1000)
    ppb:   [-5, 5]            # logit10(fraction unbound)
    caco2: [-3, 3]            # log10 1e-6 cm/s Papp (same assay family as mdck)

# --- temporal fraction-split experiment (python/temporal_fractions_{rf,chemprop}.py) ---
# Three single-cut temporal splits (train oldest 1-f, test newest f) per endpoint by SRB id, to find a
# cut with enough test spread for a meaningful R2det. Arms per endpoint: RF internal + RF augmented +
# (for the chemprop endpoints) chemprop augmented, on the IDENTICAL compound sets. Test compounds are
# removed from training ENTIRELY (all tasks) — a "virtual enumerated" holdout. FULL public (NO cap).
TEMPORAL_FRACTIONS:
  fractions: [0.4, 0.3, 0.2]                    # newest-f held out as test (train 60/70/80)
  output_dir: output/predictions_runs_temporal_fractions
  # per endpoint: augmented = RF source-set(s); chemprop = grouping (or ~); cp_arms = chemprop source-set arms
  # (LMs drop EXP-only, so RF keeps both but chemprop only EXP+NVS); cp_clusters = custom Novartis-column multitask arms
  endpoints:
    solubility: {augmented: ["EXP"],           chemprop: all8,      cp_arms: ["EXP"],     cp_clusters: []}
    logd:       {augmented: ["EXP+NVS+ADM"],   chemprop: ~,         cp_arms: [],          cp_clusters: []}
    hlm:        {augmented: ["EXP", "EXP+NVS"], chemprop: clearance, cp_arms: ["EXP+NVS"], cp_clusters: []}
    mlm:        {augmented: ["NVS"],           chemprop: clearance, cp_arms: ["NVS"],     cp_clusters: []}
    rlm:        {augmented: ["EXP", "EXP+NVS"], chemprop: clearance, cp_arms: ["EXP+NVS"], cp_clusters: []}
    caco2:      {augmented: ["EXP"],           chemprop: ~,         cp_arms: [],          cp_clusters: []}
    mdck:       {augmented: ["NVS"],           chemprop: all8,      cp_arms: ["NVS"],     cp_clusters: ["mdck_perm"]}
    ppb:        {augmented: ["EXP+NVS"],       chemprop: ~,         cp_arms: [],          cp_clusters: ["ppb_fu"]}
  # custom chemprop multitask arms: internal `target` (eval endpoint) + these Novartis predicted columns as
  # auxiliary co-training tasks (built by python/build_novartis_clusters.py -> tf_novartis_<name>.parquet)
  clusters:
    mdck_perm: {target: mdck, novartis_cols: ["pred(LE-MDCKv2_LogPapp)", "pred(LE-MDCKv1_LogPapp)", "pred(Caco-2_LogPapp)", "pred(MDCK-MDR1_LogER)", "pred(logPAMPA)"]}
    ppb_fu:    {target: ppb,  novartis_cols: ["pred(LogFu-Rat)", "pred(LogFu-Human)", "pred(LogFu-Mouse)", "pred(LogFu-Dog)", "pred(LogFu-Monkey)", "pred(HPLC LogFu HSA)", "pred(LogFubrain)", "pred(LogFumic)", "pred(Direct NIBR LogP)", "pred(Direct NIBR LogD7.4)"]}
  chemprop_epochs: 30                           # fast small model for the overnight run (ensemble=1)
  # hand-picked fast config (beat HPO trial 0 on these small temporal blocks: lower RMSE on 9/12 arms)
  chemprop_hp: {depth: 3, message_hidden_dim: 300, ffn_hidden_dim: 300, ffn_num_layers: 2, dropout: 0.1464, batch_size: 256, aggregation: sum}

# --- systematic Chemprop grouping run (python/run_Chemprop_SystematicGroups.py; env chemprop) ---
# Trains one multitask model per grouping (augmented+internal, temporal only) and scores each member
# endpoint on the SAME local per-endpoint temporal test as the RF run. Hyperparams read from the HPO.
CHEMPROP_SYSTEMATIC:
  output_dir: output/predictions_runs_chemprop
  epochs: 50
  patience: 15
  # descriptastorus RDKit-2D normalized descriptors concatenated to the learned D-MPNN representation
  # (known accuracy boost; chemprop computes them via descriptastorus). Must be passed at BOTH train
  # and predict in chemprop v2 (only the fitted scaler is stored). [] disables. MLTrail predict needs
  # the SAME flag to deploy such a model (backend not yet featurizer-aware — see wiki).
  molecule_featurizers: [v1_rdkit_2d_normalized]
  cv_folds: 5                        # --cv: K-fold over internal compounds (public always in train), mirrors RF eval_cv
  hpopt_config: autoresearch/predict_adme/chemprop_run/hpopt/best_config.json  # HPO best params (read at run time)
  register_mltrail: false            # MLTrail v1 cannot PREDICT chemprop (backend stub) -> archive-only; off until decided
  groupings:                         # grouping name -> member endpoints (from autoresearch validation)
    sol_logd:  [solubility, logd]
    clearance: [hlm, mlm, rlm]
    all8:      [solubility, logd, hlm, mlm, rlm, caco2, mdck, ppb]

# --- public-only -> internal experiment (external-validation / domain-transfer baseline) ---
# Train each endpoint's WINNING model on PUBLIC data ONLY (zero internal compounds in train) and predict
# ALL internal compounds. Measures pure public->internal transfer (the floor internal data lifts us above).
#   RF arm:       python python/run_RF_SingleTask_systematic.py --public-only --endpoints logd,caco2,ppb
#   Chemprop arm: python python/run_Chemprop_SystematicGroups.py --public-only --groupings clearance all8
#   combine:      python python/combine_public_to_internal.py   (assembles the winner table below)
# winners = per-endpoint best model/grouping from the CV+temporal head-to-head; REFRESH after CV lands.
PUBLIC_TO_INTERNAL:
  winners:
    solubility: {model: chemprop, grouping: all8}
    logd:       {model: rf}
    hlm:        {model: chemprop, grouping: clearance}
    mlm:        {model: chemprop, grouping: clearance}
    rlm:        {model: chemprop, grouping: clearance}
    caco2:      {model: rf}
    mdck:       {model: chemprop, grouping: all8}
    ppb:        {model: rf}

# --- multitask ADME regression ---
ADME_OVERWRITE: false
ADME_CSV: data/20260707_all_adme.csv
ADME_ID_COL: name              # SRB-XXXXXXX id; digits give temporal recency (bigger = newer)
ADME_SMILES_COL: smiles
# endpoint -> in-house target column + transform to modelling space.
# transforms: log10 (assay value must be >0), identity (already log), logit_pct (%->fraction->logit)
ADME_ENDPOINTS:
  solubility: {col: 'solubility_Thermodynamic Solubility (1)', transform: log10,     unit: uM, label_cap_raw: 15000}   # winsorize saturated high solubility (µM)
  logd:       {col: 'logd_LogD7.4',                            transform: identity,  unit: logD7.4}
  hlm:        {col: 'hlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  mlm:        {col: 'mlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  rlm:        {col: 'rlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  caco2:      {col: 'caco2_Mean Papp A to B',                  transform: log10,     unit: 1e-6cm/s}
  mdck:       {col: 'mdck_Mean Papp A to B',                   transform: log10,     unit: 1e-6cm/s, filter: {col: 'mdck_Cell line', contains: MDR1}}  # MDR1-MDCK only (drop MDR2/MDR3)
  ppb:        {col: 'ppb_%Unbound',                            transform: logit_pct, unit: pct_unbound}

# public-source harmonization: per-endpoint best public dataset + unit conversion to modelling space.
# tier: direct (same units) | convert (deterministic) | scale (physiological, approximate) | none
ADME_PUBLIC:
  logd:  {source: tdc, name: Lipophilicity_AstraZeneca, tier: direct,  op: identity}
  hlm:   {source: tdc, name: Clearance_Microsome_AZ,    tier: direct,  op: log10}
  caco2: {source: tdc, name: Caco2_Wang,                tier: convert, op: log10_offset, offset: 6.0}  # cm/s -> 1e-6 cm/s
  ppb:   {source: tdc, name: PPBR_AZ,                   tier: convert, op: pctbound_to_logit_fu}
  hlm_biogen: {source: biogen, col: 'LOG HLM_CLint (mL/min/kg)', tier: scale, op: log_clint_bw_to_invitro, species: human}
  rlm:        {source: biogen, col: 'LOG RLM_CLint (mL/min/kg)', tier: scale, op: log_clint_bw_to_invitro, species: rat}
  ppb_biogen: {source: biogen, col: 'LOG PLASMA PROTEIN BINDING (HUMAN) (% unbound)', tier: convert, op: log_pctunbound_to_logit_fu}
# physiological scaling: mL/min/kg = uL/min/mg x MPPGL(mg/g liver) x LW(g liver/kg bw) / 1000
ADME_SCALING:
  human: {MPPGL: 32.0, LW: 20.0}
  rat:   {MPPGL: 45.0, LW: 40.0}
BIOGEN_ADME_CSV: data/public_solubility/biogen_fang_adme/ADME_public_set_3521.csv

# public solubility (from the predict_solubility project's harmonize_solubility, µM).
# in-house solubility endpoint = THERMODYNAMIC (log10 µM), so augment with thermodynamic public only.
# Cleaning sweep (wiki 2026-07-20, S2_thermo): dropping kinetic (82% of public, ~+1.8 log10 shift) lifts
# calibrated CV R²_det 0.65->0.71, zeroes the bias (-0.05->0.00), and makes raw-µM predictions meaningful
# (raw R²_det ~0->0.54). The physical clip removes an impossible high tail (solubility > 1 mol/L).
SOL_HARMONIZED_CSV: data/public_solubility/harmonized_sol.csv
SOL_PUBLIC_TYPES: [thermodynamic_experimental]   # thermo-only (was thermo+kinetic); assay-type match to internal
SOL_MAX_LOG10_UM: 6.0            # drop physically-impossible solubility > 1 mol/L (=1e6 µM; water ~55 mol/L); ~0.9% of thermo rows
SOL_DROP_ORIGINS: []             # optional raw-origin blocklist; [PHYS, AQUA] reproduces sweep S9_thermo_pruned (clip already removes their impossible tail)
SOL_SUBSAMPLE_PER_TYPE: 5000     # cap per type (dedup by InChIKey first) for RF tractability; run build with 'full' to keep all thermo

# ADMETlab predictions on PROTAC-DB patent compounds (63k, in our chemical space) — 2nd predictor
# (cf. Novartis). Covers logd/caco2/mdck/ppb/solubility; NOT microsomal clearance (LM-human is a
# 0-1 stability prob, cl-plasma is whole-body). PREDICTED, not experimental.
ADMETLAB_CSV: data/public_solubility/protac_patent/PROTAC_Patent_Compounds.xlsx
ADMETLAB_SUBSAMPLE: full          # int cap, or 'full' = use all ~63k PROTAC-patent compounds
ADMETLAB_PUBLIC:                 # pred column -> in-house modelling space
  logd:       {col: logD,  op: identity}
  caco2:      {col: caco2, op: log10cm_s_plus6}      # log10(cm/s) -> log10(1e-6 cm/s)
  mdck:       {col: MDCK,  op: log10cm_s_plus6}      # GAP endpoint (with Novartis)
  ppb:        {col: PPB,   op: pctbound_to_logit_fu} # %bound -> logit(fu)
  solubility: {col: logS,  op: logSmolL_plus6}       # log10(mol/L) -> log10(µM)

# Novartis/NIBR in-silico ADME PREDICTIONS (not experimental) on ProtacDB2.0+ZINC+ChEMBL.
# Used to test 3 roles: benchmark vs experimental, stacking features, distillation/pretraining.
NOVARTIS_CSV: data/protacdb2.0_zinc_chembl_dataset.csv
NOVARTIS_SUBSAMPLE: full          # int cap (PROTAC-DB kept fully + rest sampled), or 'full' = all ~273k
NOVARTIS_PUBLIC:                  # pred column -> in-house modelling space (op as in ADME_PUBLIC)
  logd:  {col: 'pred(Direct NIBR LogD7.4)', op: identity}
  hlm:   {col: 'pred(hLM LogCLint)',        op: identity}
  mlm:   {col: 'pred(mLM LogCLint)',        op: identity}   # GAP endpoint — only public signal
  rlm:   {col: 'pred(rLM LogCLint)',        op: identity}
  caco2: {col: 'pred(Caco-2_LogPapp)',      op: identity}   # appears log10(1e-6 cm/s); verified by benchmark
  mdck:  {col: 'pred(LE-MDCKv2_LogPapp)',   op: identity}   # GAP — LE-MDCK proxy (not MDR1); flag
  ppb:   {col: 'pred(LogFu-Human)',         op: logfu_to_logit}


# public EXP parquet(s) per endpoint (concatenated; value already in modelling space) for the generic
# DATA._endpoint_dfs builder. solubility/logd/mdck keep their own bespoke get_*_data methods.
ENDPOINT_PUBLIC_FILES:
  solubility: [public_solubility.parquet]
  logd:  [public_logd.parquet]
  mdck:  [public_novartis_mdck.parquet, public_admetlab_mdck.parquet]
  hlm:   [public_hlm.parquet, public_novartis_hlm.parquet]
  mlm:   [public_novartis_mlm.parquet]
  rlm:   [public_rlm.parquet, public_novartis_rlm.parquet]
  caco2: [public_caco2.parquet, public_novartis_caco2.parquet, public_admetlab_caco2.parquet]
  ppb:   [public_ppb.parquet, public_novartis_ppb.parquet, public_admetlab_ppb.parquet]

BEST_PUBLIC:
  solubility: ['thermodynamic:ChEMBL','thermodynamic:AQUA','thermodynamic:PHYS']
  logd:       ['TDC:Lipophilicity_AstraZeneca']
  mdck:       ['Novartis-NIBR']
  hlm:        ['Biogen:hlm_biogen','Novartis-NIBR']
  mlm:        ['Novartis-NIBR']
  rlm:        ['Biogen:rlm', 'Novartis-NIBR']
  caco2:      ['Novartis-NIBR', 'ADMETlab-PROTAC']
  ppb:        ['TDC:PPBR_AZ']

## ---- ML model training and deployment ---- ##
MF_features_all_path: 'output/features/'   # DATA.build_MF_features writes/loads <date>_MF_features.parquet here (all compounds in df_all)
METRICS_PKL_DIR: 'output/results/20260825_metrics/'   # OUTPUT.assess_predictions writes <k>.pkl here (per-endpoint arms)

# OUTPUT.deploy_all_endpoints — fit the deployable RF (internal + BEST_PUBLIC public) and register to MLTrail.
DEPLOY:
  features_type: 'H237'          # featurizer MLTrail re-derives at predict time (needs descriptastorus)
  experiment_suffix: '_h237'     # new models land as adme_<endpoint><suffix> (champions adme_<endpoint> untouched)


# ---- Prediction webapp (webapp/app.py) — LiveDesign-style drag-drop scorer, LOCALHOST ONLY ----
# Scores dropped SDF/CSV compounds with the 8 champion RF (H236) models in the MLTrail vault.
webapp:
  host: '127.0.0.1'                # bind localhost only — chemistry data must not leave the box
  port: 8050
  endpoint_order: [solubility, logd, mdck, hlm, mlm, rlm, caco2, ppb]   # column order in the grid
  confidence_split: 0.5            # confidence > split -> azure, <= split -> ember (diverging gradient)
  cutoffs:                         # raw-unit triage cutoff + the comparison that means FAVORABLE
    solubility: {value: 10, favorable: '>='}   # uM
    logd:       {value: 3,  favorable: '<'}     # logD7.4 sweet-spot upper bound
    hlm:        {value: 12, favorable: '<'}     # uL/min/mg (WEAK: measurement-floor convention)
    mlm:        {value: 12, favorable: '<'}     # uL/min/mg
    rlm:        {value: 12, favorable: '<'}     # uL/min/mg
    caco2:      {value: 10, favorable: '>='}    # 1e-6 cm/s
    mdck:       {value: 10, favorable: '>='}    # 1e-6 cm/s
    ppb:        {value: 1,  favorable: '<'}     # % unbound


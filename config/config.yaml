# ADME_ML — config for the ADME_build_ML.py workflow and the prediction webapp.
#
# SCOPE: THREE consumers, nothing else. Every key below is read by at least one of them (verified by grep);
# every key only a retired script read was removed. The full pre-2026-09-03 config is preserved verbatim at
#   config/config_legacy_20260903.yaml
# Point any legacy runner at that file with --config config/config_legacy_20260903.yaml.
#
# WHO READS WHAT
#   python/ADME_build_ML.py            : RUN PATHS (ADME_RAW_CSV, METRICS_PKL_RF_DIR, METRICS_PKL_CP_DIR,
#                                        CHEMPROP_OUTPUT_DIR, CHEMPROP_PRETRAIN_DIR), ADME_ENDPOINTS,
#                                        ENDPOINT_PUBLIC_FILES, BEST_PUBLIC, RF_SINGLETASK,
#                                        BEST_CHEMPROP_GROUPINGS, CHEMPROP_TRANSFER, MF_features_all_path,
#                                        FOLD_GROUP_BY_INCHIKEY, DEPLOY, MLTRAIL_IDS
#   vignettes/Multitask_adme_preds.ipynb: ADME_ENDPOINTS, BEST_PUBLIC, RF_SINGLETASK, METRICS_PKL_RF_DIR,
#                                        METRICS_PKL_CP_DIR, SERAC_C, webapp
#   webapp/app.py                      : ADME_ENDPOINTS, SERAC_C, webapp, MLTRAIL_IDS, CHEMPROP_TRANSFER
#
# CAUTION: PARAMS.load_params does __dict__.update(yaml), so every top-level key becomes params.<KEY>.
# Removing a key that a method reads fails only at that call site — grep before deleting one.

## ==================== RUN PATHS — CHANGE THESE FIVE TOGETHER FOR A NEW RUN ====================
# Every path that carries a run date lives here. Bump all five to the same stamp; a mixed set silently
# blends two runs (e.g. chemprop scored on the PREVIOUS run's RF folds).
# ORDER: run --assess_RF_all_endpoints BEFORE --assess_CP_all_endpoints. DATA._cp_folds reads the `fold`
# column of <METRICS_PKL_RF_DIR>/<ep>.pkl, so an empty RF dir makes chemprop build its own, incomparable folds.
# CAUTION: `--overwrite` WRITES the CDD Vault pull to ADME_RAW_CSV. Point it at a NEW file, or the pull
# overwrites that snapshot and the old internal data is not recoverable.
# NOT dated, so NOT here: MF_features_all_path (the public feature cache is keyed by its own `date`
# argument and public SMILES never change; the internal block is always recomputed).
ADME_RAW_CSV: 'data/20260923_all_adme.csv' # 'data/20260707_all_adme.csv'                 # DATA.load_df_internal_exp_all reads this csv; --overwrite re-pulls from CDD Vault and rewrites it
METRICS_PKL_RF_DIR: 'output/results/20260923_metrics_rf'   # OUTPUT.assess_predictions writes <k>.pkl here (6 RF arms); ALSO the fold source for chemprop
METRICS_PKL_CP_DIR: 'output/results/20260923_metrics_cp'   # OUTPUT.assess_predictions_cp writes <k>.pkl here (3 chemprop arms)
# The next two are read as CHEMPROP_TRANSFER.output_dir / .pretrain_dir. They are YAML anchors, so the
# value lives HERE and the CHEMPROP_TRANSFER entries below are aliases (*name). Edit them here only.
CHEMPROP_OUTPUT_DIR:   &cp_output_dir   'output/predictions_runs_chemprop_transfer_20260923'   # per-endpoint chemprop workdirs <grouping>_<ep>
# SAFE TO REUSE, including after a crash: chemprop rewrites fold*/model/model_0 on every run, and the
# transfer path never passes --ensemble-size, so no model_1 is ever left behind for ML_Reg's
# model_*/best.pt glob to pick up. Bump it only to KEEP a finished run's workdirs for comparison.
CHEMPROP_PRETRAIN_DIR: &cp_pretrain_dir 'output/chemprop_models/transfer_pretrain'    # persisted stage-1 checkpoints, reused per grouping
# REUSED SILENTLY: assess_predictions_cp passes NO force_pretrain, so a cached checkpoint is loaded as
# it is. BUMP THIS (or delete the grouping's directory) whenever the PUBLIC pool changes:
# ENDPOINT_PUBLIC_FILES, CHEMPROP_TRANSFER.public_proxy, or a grouping's task list.
# New INTERNAL compounds reach the pool ONLY through leak control (drop_internal_twins), so check the
# run's `leak control (exact): dropped N of M` line — N has been 0 in every run to date (our bRo5
# compounds never twin a public molecule), so in practice a CDD pull does NOT invalidate stage 1.

## ==================== ENDPOINT DEFINITIONS ====================
# endpoint -> in-house target column + transform to modelling space.
# transforms: log10 (assay value must be >0), identity (already log), logit_pct (%->fraction->logit)
ADME_ENDPOINTS:
  solubility: {col: 'solubility_Thermodynamic Solubility (1)', transform: log10,     unit: uM, label_cap_raw: 15000}   # winsorize saturated high solubility (µM)
  logd:       {col: 'logd_LogD7.4',                            transform: identity,  unit: logD7.4}
  hlm:        {col: 'hlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  mlm:        {col: 'mlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  rlm:        {col: 'rlm_CLint (raw)',                         transform: log10,     unit: uL/min/mg}
  caco2:      {col: 'caco2_Mean Papp A to B',                  transform: log10,     unit: 1e-6cm/s}
  mdck:       {col: 'mdck_Mean Papp A to B',                   transform: log10,     unit: 1e-6cm/s, filter: {col: 'mdck_Cell line', contains: MDR1}}  # MDR1-MDCK only (drop MDR2/MDR3)
  mdck_inh:   {col: 'mdck_Mean Papp A to B - PgP Inhibitor',   transform: log10,     unit: 1e-6cm/s, filter: {col: 'mdck_Cell line - PgP inhibitor', contains: MDR1}}  # the INHIBITOR arm's own cell-line column: 147 rows, vs 146 on 'mdck_Cell line' (one row has it blank)
  ppb:        {col: 'ppb_%Unbound',                            transform: logit_pct, unit: pct_unbound}

## ============ PUBLIC DATA (prebuilt parquets) + PER-ENDPOINT SELECTIONS ============
## The two BEST_* keys below are SELECTIONS, one per endpoint: which public origins the RF augments with,
## and which chemprop pretrain grouping wins. Their definitions live in the MODELS section further down.
# public EXP parquet(s) per endpoint (concatenated; value already in modelling space) for the generic
# DATA._endpoint_dfs builder. solubility/logd/mdck keep their own bespoke get_*_data methods.
# THIS IS THE PUBLIC-SOURCE POLICY. df_all takes its public rows from exactly these files, so a file left
# out here can never reach an RF arm or a chemprop pretrain. It replaced RF_SINGLETASK.augmented_sources on
# 2026-09-08, which the live path never read (only the retired systematic runner did).
# ADMETlab PREDICTED values are excluded for solubility, mdck and ppb — measured ablations:
#   solubility  experimental-only moves temporal 0.044 -> 0.313 (predicted pseudo-labels poison the newest
#               compounds; wiki 2026-07)
#   mdck        dropping ADMETlab lifts 0.163 -> 0.321
#   ppb         dropping ADMETlab lifts 0.149 -> 0.316
# caco2 KEEPS ADMETlab: it is the one endpoint where that source helps (BEST_PUBLIC lists it).
ENDPOINT_PUBLIC_FILES:
  solubility: [public_solubility.parquet]
  logd:  [public_logd.parquet]
  mdck:  [public_novartis_mdck.parquet]
  mdck_inh: [public_chembl_mdck_inh.parquet]   # 289 ChEMBL compounds, MDR1-MDCK Papp A->B WITH a P-gp inhibitor (python/harvest_chembl_mdck_inh.py)
  hlm:   [public_hlm.parquet, public_novartis_hlm.parquet]
  mlm:   [public_novartis_mlm.parquet]
  rlm:   [public_rlm.parquet, public_novartis_rlm.parquet]
  caco2: [public_caco2.parquet, public_novartis_caco2.parquet, public_admetlab_caco2.parquet]
  ppb:   [public_ppb.parquet, public_novartis_ppb.parquet]

BEST_PUBLIC:
  solubility: ['thermodynamic:ChEMBL','thermodynamic:AQUA']   # PHYS removed 2026-09-22: 834 compounds, so min_n always dropped it (config said one thing, the model trained on another)
  logd:       ['TDC:Lipophilicity_AstraZeneca']
  mdck:       ['Novartis-NIBR']
  mdck_inh:   ['ChEMBL:MDCK-MDR1_PgP-inhibitor']   # needs PUBLIC_ORIGIN_MIN_N <= 289
  hlm:        ['Biogen:hlm_biogen','Novartis-NIBR']
  mlm:        ['Novartis-NIBR']
  rlm:        ['Biogen:rlm', 'Novartis-NIBR']
  caco2:      ['Novartis-NIBR', 'ADMETlab-PROTAC']
  ppb:        ['TDC:PPBR_AZ']
# Best chemprop TRANSFER grouping per endpoint — the chemprop analogue of BEST_PUBLIC above.
# Measured 2026-09-02 (public pretrain -> frozen-encoder finetune on RF's EXACT folds; see wiki).
# endpoint -> the stage-1 pretrain grouping that WON it. The value names an entry of
# CHEMPROP_TRANSFER.groupings or CHEMPROP_TRANSFER.clusters below, and that entry alone defines the tasks, so
# nothing can drift. Public rows come from the WIDE df_all, so their sources are ENDPOINT_PUBLIC_FILES above.
# The MEASUREMENTS live in the wiki, not here (a score in a config goes stale in silence): see the champion
# table in wiki/wiki.md for each endpoint's r2det, which model wins, and by how much.
# CAUTION: chemprop wins only 5/8. For solubility, mdck and ppb the entry names chemprop's BEST grouping but
# RF still wins, so a deploy step must compare the LIVE numbers in METRICS_PKL_RF_DIR vs METRICS_PKL_CP_DIR —
# never assume this mapping means "ship chemprop".
# CAUTION: chemprop wins only 5/8. For solubility/mdck/ppb the entry records chemprop's BEST grouping but RF
# still wins (solubility RF-augmented 0.731, mdck RF+near-shell 0.539, ppb RF-augmented 0.537) — a deploy step
# must honour `beats_rf`, not just pick the chemprop grouping.
BEST_CHEMPROP_GROUPINGS:
  hlm:        clearance
  mlm:        clearance
  rlm:        clearance
  caco2:      permeability
  logd:       sol_lipo
  solubility: all8
  mdck:       mdck_perm
  mdck_inh:   permeability_inh   # NOT yet measured against RF — the first run sets the champion
  ppb:        ppb_fu

## ==================== MODELS ====================
# --- champion RF hyperparameters ---
# Every key here is read by ADME_build_ML.py: `champion` / `seed` / `n_jobs` build every RF arm, the deployed
# model and the webapp model (OUTPUT.__init__ -> make_model); `cv_folds` + `seed` size the internal CV
# (select_best_combo_and_update). The systematic-runner knobs (output_dir, features_type, register_mltrail,
# archive_public_in_trainset, augmented_sources) were REMOVED on 2026-09-08 — see ENDPOINT_PUBLIC_FILES for
# where the public-source policy now lives.
RF_SINGLETASK:
  seed: 42
  n_jobs: 32
  cv_folds: 5
  champion: {n_estimators: 200, max_depth: 20, max_features: 0.3, min_samples_leaf: 2}
# --- Chemprop TRANSFER LEARNING arm (ADME_build_ML.py: build_ML_data_CP + assess_predictions_cp) ---
# Public pretrain -> frozen-encoder multitask finetune on internal, evaluated on RF's EXACT folds.
# Stage 1: multitask chemprop train on PUBLIC ONLY per grouping (never sees an internal label -> cannot
# leak into any internal fold; paid once, reused by every endpoint/fold).
# Stage 2: per (endpoint, fold) `--checkpoint <stage1> --freeze-encoder` on that endpoint's RF fold-TRAIN
# compounds, keeping the SAME multitask target columns (head shape must match) so the finetune uses ALL the
# train compounds' relevant internal labels (NaN-masked where unmeasured) -- mimics production.
# CAUTION: RF folds differ per endpoint, so a compound in hlm's train fold can be in rlm's TEST fold.
# One finetune per (endpoint, fold); never score several endpoints from one finetuned model.
CHEMPROP_TRANSFER:
  chemprop_bin: ~/miniconda3/envs/chemprop/bin/chemprop   # shelled out to, so the runner can live in env ML
  output_dir: *cp_output_dir      # set in RUN PATHS at the top of this file
  pretrain_dir: *cp_pretrain_dir  # set in RUN PATHS at the top of this file
  epochs_pretrain: 30
  epochs_finetune: 30
  patience: 15
  seed: 42                             # drives --data-seed AND --pytorch-seed; the PyTorch seed also turns
                                       # on Lightning's deterministic mode, so two identical runs give identical numbers
  freeze_encoder: true                 # stage 2 trains only the FFN head (set false for a full finetune)
  # precomputed descriptastorus DS_* columns are preferred; [] uses none. Chemprop recomputes only if
  # molecule_featurizers is set instead. Flags MUST match between pretrain, finetune and predict.
  descriptors: precomputed             # precomputed | featurizer | none
  molecule_featurizers: [v1_rdkit_2d_normalized]   # used only when descriptors: featurizer
  hp: {depth: 3, message_hidden_dim: 300, ffn_hidden_dim: 300, ffn_num_layers: 2, dropout: 0.1464, batch_size: 256, aggregation: sum}
  # ENDPOINT groupings: tasks are internal endpoint columns, public from public_*/public_novartis_* parquets.
  # sol_logd dropped (worst grouping for both its members, 2026-07). Task RELATEDNESS decides the outcome:
  # `clearance` (one assay, 3 species) won 3/3; `all8` (8 heterogeneous properties) lost 5/5 (wiki 2026-09-02).
  groupings:
    clearance:    [hlm, mlm, rlm]
    permeability: [caco2, mdck]         # same assay family (Papp A->B) — the clearance analogue for permeability
    permeability_inh: [caco2, mdck, mdck_inh]   # the same family plus the P-gp-inhibited MDCK arm (mdck_inh only)
    sol_lipo:     [solubility, logd]     # retest as a PRETRAIN block (2026-07 verdict was for multitask prediction)
    all8:         [solubility, logd, hlm, mlm, rlm, caco2, mdck, ppb]
  # CLUSTER groupings: tasks are the internal target endpoint + related raw Novartis pred(...) columns as
  # auxiliary co-training tasks (prebuilt by python/build_novartis_clusters.py). Aux column names are read
  # from the parquet schema (everything except smiles/_ik), so they are not duplicated here.
  # PUBLIC PROXY — a task with NO public label breaks stage 1. Chemprop fits one target scaler per task,
  # so an all-NaN column gives a NaN scaler and that head predicts NaN forever; the frozen-encoder
  # finetune inherits the scaler and cannot repair it (seen 2026-09-22 on mdck_inh: every fold rmse=nan).
  # A proxy fills that task's PUBLIC rows from a related public column. INTERNAL rows keep their real
  # labels, so only stage 1 is affected, and the stage-2 head re-learns any offset on internal data.
  # CAUTION: this is a modelling assumption, not a measurement. Record it in the wiki when you add one.
  public_proxy:
    mdck_inh: {file: tf_novartis_mdck_perm.parquet, column: LE_MDCKv2_LogPapp}   # wild-type MDCK (no P-gp) ~ MDR1-MDCK + P-gp inhibitor; std 0.557 vs internal 0.568, offset +1.49 log
  clusters:
    mdck_perm: {target: mdck, file: tf_novartis_mdck_perm.parquet}   # MDCKv1/v2, Caco-2, MDR1 LogER, logPAMPA
    ppb_fu:    {target: ppb,  file: tf_novartis_ppb_fu.parquet}      # LogFu x5 species, HSA, Fubrain, Fumic, LogP/LogD

## ==================== PATHS / CV POLICY ====================
## The run-dated paths moved to RUN PATHS at the top of this file. What stays here carries no run date.
MF_features_all_path: 'output/features/'   # DATA.build_MF_features writes/loads <date>_MF_features.parquet here (all compounds in df_all)
# Minimum compounds for a public ORIGIN to enter an RF arm (get_internal_public_sets keeps count > this).
# RF ONLY — chemprop reads ENDPOINT_PUBLIC_FILES straight from df_all and ignores both this and BEST_PUBLIC.
# Lowered 1000 -> 100 on 2026-09-22 so mdck_inh's 289 ChEMBL compounds reach the RF augmented arm.
# Verified the same day: at 100 no OTHER endpoint's combo changes, because every origin BEST_PUBLIC
# names is far above either threshold. `--min_n` on the CLI still overrides this.
PUBLIC_ORIGIN_MIN_N: 100
FOLD_GROUP_BY_INCHIKEY: true   # CV folds grouped by InChIKey so a molecule's twins never split across train/test (anti-leakage)

## ==================== DEPLOYMENT ====================
# OUTPUT.deploy_all_endpoints — fit the deployable RF (internal + BEST_PUBLIC public) and register to MLTrail.
DEPLOY:
  features_type: 'H237'          # featurizer MLTrail re-derives at predict time (needs descriptastorus)
  experiment_suffix: '_h237'     # new models land as adme_<endpoint><suffix> (champions adme_<endpoint> untouched)

## ==================== MLTRAIL MODEL IDS — the pinned vault entries ====================
# ONE id per endpoint per framework. Read by OUTPUT.vault_id (deploy) and webapp/app.py (serving), so
# the same entry is appended to and served — no name matching, no dependence on registry.list() order.
#   rf       -> adme_<ep>_h237. Supplies the CONFIDENCE for EVERY endpoint, and the value where
#               webapp.value_model says 'rf'. Every endpoint needs one.
#   chemprop -> adme_<ep>_cp. Supplies the VALUE only, where webapp.value_model says 'chemprop'.
# A deploy APPENDS a new version to the id named here. `null` = not deployed yet: the deploy creates
# the entry, prints `> PIN THIS: MLTRAIL_IDS.<framework>.<ep>: <id>`, and you paste the id back here.
# CAUTION: an id is an identity, not a version. Repointing one at another endpoint makes the webapp
# serve the wrong property under the right name. Audit with:
#   python python/ADME_build_ML.py --check_mltrail_ids
MLTRAIL_IDS:
  rf:                        # adme_<ep>_h237 — confidence for all 9, value where value_model says rf
    solubility: 20
    logd:       21
    hlm:        22
    mlm:        23
    rlm:        24
    caco2:      25
    mdck:       26
    mdck_inh:   36
    ppb:        27
  chemprop:                  # adme_<ep>_cp — value only, where value_model says chemprop
    solubility: 32
    logd:       31
    hlm:        28
    mlm:        29
    rlm:        30
    caco2:      33
    mdck:       34
    mdck_inh:   null         # not deployed yet — the first --deploy_CP_all_endpoints creates it
    ppb:        35           # kept for provenance; value_model says rf, so the webapp ignores it

## ==================== WEBAPP ====================
SERAC_C:                    # named palette: name -> hex (quote hex; '#' is a YAML comment otherwise)
  azure: '#0EA5CE'
  ember: '#E65D32'
  terracotta: '#EEA090'
  gold: '#E8B04B'
  olive: '#74B24A'
  sky_blue: '#A6C8E4'
  paper: '#E3E0DA'
# ---- Prediction webapp (webapp/app.py) — LiveDesign-style drag-drop scorer, LOCALHOST ONLY ----
# Scores dropped SDF/CSV compounds with the 8 champion RF (H236) models in the MLTrail vault.
webapp:
  host: '127.0.0.1'                # bind localhost only — chemistry data must not leave the box
  port: 8050
  endpoint_order: [solubility, logd, mdck, mdck_inh, hlm, mlm, rlm, caco2, ppb]   # column order in the grid
  confidence_split: 0.5            # confidence > split -> azure, <= split -> ember (diverging gradient)
  color_slope: 2.0                 # value-fade steepness per modelling-space unit from the cutoff (higher = harder edge)
  cutoffs:                         # raw-unit triage cutoff + the comparison that means FAVORABLE
    solubility: {value: 10, favorable: '>='}   # uM
    logd:       {value: 3,  favorable: '<'}     # logD7.4 sweet-spot upper bound
    hlm:        {value: 12, favorable: '<'}     # uL/min/mg (WEAK: measurement-floor convention)
    mlm:        {value: 12, favorable: '<'}     # uL/min/mg
    rlm:        {value: 12, favorable: '<'}     # uL/min/mg
    caco2:      {value: 10, favorable: '>='}    # 1e-6 cm/s
    mdck:       {value: 10, favorable: '>='}    # 1e-6 cm/s
    mdck_inh:   {value: 10, favorable: '>='}    # 1e-6 cm/s, P-gp inhibited
    ppb:        {value: 1,  favorable: '<'}     # % unbound
  # Which model supplies the VALUE per endpoint (winners of the AUGMENTED arm, r2, wiki 2026-09-09).
  # The CONFIDENCE always comes from the RF model adme_<ep>_h237 — a chemprop regression head
  # returns no per-row std — so RF stays deployed for all 8 endpoints whatever this map says.
  #   'rf'       -> adme_<ep>_h237  (sklearn bundle, internal + BEST_PUBLIC)
  #   'chemprop' -> adme_<ep>_cp    (chemprop dir, public pretrain + frozen finetune)
  # CAUTION: near-shell (dist060_agree) wins logd, mdck and caco2, but it has NO deploy path yet, so
  # each falls back to the best model that ships. Add 'near_shell' here once it reaches MLTrail.
  # r2 of the AUGMENTED arm, 2026-09-23 run (METRICS_PKL_RF_DIR vs METRICS_PKL_CP_DIR), RF -> chemprop.
  value_model:
    solubility: chemprop     # 0.707 (all8)             vs RF 0.704 — +0.003, inside the noise
    logd:       chemprop     # 0.798 (sol_lipo)         vs RF 0.792 — +0.006, inside the noise
    hlm:        chemprop     # 0.635 (clearance)        vs RF 0.493
    mlm:        chemprop     # 0.671 (clearance)        vs RF 0.558
    rlm:        chemprop     # 0.537 (clearance)        vs RF 0.303
    mdck:       chemprop     # 0.456 (mdck_perm)        vs RF 0.357 — flipped from rf 2026-09-24
    mdck_inh:   chemprop     # 0.693 (permeability_inh) vs RF 0.669 — first measurement of this arm
    caco2:      chemprop     # 0.669 (permeability)     vs RF 0.539 — flipped from rf 2026-09-24
    ppb:        rf           # RF 0.481 vs chemprop 0.146 (ppb_fu) — RF wins outright

  # Extra MLTrail models shown as their own grid column. NOT part of the MPO formula scope.
  extra_models:
    - key: px_activity                  # column key; also <key>_pred / <key>_conf in filters + the CSV
      model_id: 19                      # MLTrail id: Px_activity_1_12_rf_H237 (single_task_classification, H237)
      label: Px activity                # column header
      unit: 'P(1 <= n_down <= 12)'      # header subtitle — probability of the single/low-activity class
      threshold: 0.5                    # probability >= threshold counts as favorable (green)
      color_slope: 8.0                  # steeper fade: a probability moves at most 0.5 from the threshold
